<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Floyd Liu · Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f3ec;
      --paper: rgba(255, 255, 255, 0.82);
      --text: #24211d;
      --muted: #7c7164;
      --border: rgba(36, 33, 29, 0.12);
      --shadow: 0 18px 50px rgba(36, 33, 29, 0.10);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 221, 168, 0.55), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(198, 218, 199, 0.55), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .site-header {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: var(--text);
      font-family: "Archivo Black", sans-serif;
      letter-spacing: -0.03em;
      font-size: 1.08rem;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.86rem;
      font-weight: 650;
      box-shadow: none;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"] {
      transform: translateY(-2px);
      background: #fff;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 10px 0 72px;
    }

    .gallery-panel {
      padding: clamp(20px, 4vw, 42px);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 8px);
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .gallery-header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(2.4rem, 7vw, 5.2rem);
      line-height: 0.92;
      letter-spacing: -0.08em;
    }

    .subtitle {
      max-width: 620px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .gallery-card {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
    }

    .gallery-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
    }

    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px 15px;
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .photo-title {
      font-weight: 650;
    }

    .photo-location {
      color: var(--muted);
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .site-header {
        width: min(100% - 24px, 1120px);
        padding: 22px 0 10px;
        display: block;
      }

      .brand {
        font-size: 1.08rem;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .nav-links {
        justify-content: flex-start;
        gap: 8px;
        margin-top: 14px;
      }

      .nav-links a {
        padding: 8px 14px;
        font-size: 0.86rem;
      }

      .page {
        width: min(100% - 24px, 1120px);
        padding: 18px 0 44px;
      }

      .gallery-panel {
        padding: 18px;
        border-radius: 24px;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      figcaption {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>
